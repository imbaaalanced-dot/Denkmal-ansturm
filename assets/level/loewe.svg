<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
  <defs>
    <linearGradient id="lion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ad72"/>
      <stop offset="0.55" stop-color="#b59a62"/>
      <stop offset="1" stop-color="#7a6238"/>
    </linearGradient>
    <linearGradient id="mane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8894e"/>
      <stop offset="1" stop-color="#6b5228"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d0508" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d0508" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Boden-Schatten -->
  <ellipse cx="350" cy="330" rx="300" ry="26" fill="url(#shadow)"/>

  <!-- Schwanz mit Quaste -->
  <path d="M120 250 C 70 240 52 210 60 178 C 66 200 84 214 108 220 C 96 206 92 190 98 176 C 112 200 132 214 152 218 Z" fill="#8a6f42"/>
  <circle cx="98" cy="172" r="12" fill="#6b5228"/>

  <!-- Hinterlauf (liegend) -->
  <path d="M96 268 C 88 210 130 176 190 172 C 236 170 268 196 270 236 C 271 268 250 288 210 292 L 130 292 C 108 290 98 282 96 268 Z" fill="url(#lion)"/>

  <!-- Koerper (liegend, Brust vorne) -->
  <path d="M250 280 C 246 226 282 192 348 188 C 420 184 480 210 500 248 C 512 272 502 292 470 296 L 290 296 C 266 294 252 290 250 280 Z" fill="url(#lion)"/>

  <!-- Vorderlaeufe ausgestreckt (Liegeloewe) -->
