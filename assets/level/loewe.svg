  <path d="M462 282 L548 276 C 566 274 576 264 572 254 C 568 246 556 244 542 246 L 468 254 Z" fill="#96793f"/>
  <ellipse cx="586" cy="296" rx="14" ry="9" fill="#6b5228"/>
  <ellipse cx="570" cy="268" rx="13" ry="8" fill="#5e4a26"/>

  <!-- Mähne -->
  <path fill="url(#mane)" d="M470 130 C 430 108 386 116 362 148 C 340 176 344 214 366 238 C 350 232 340 218 338 200 C 326 226 336 258 362 274 C 356 262 356 250 360 240 C 366 272 392 292 424 294 C 416 284 412 272 414 262 C 434 282 466 286 490 272 C 480 262 476 250 478 240 C 502 246 526 234 534 212 C 522 220 510 222 500 218 C 520 200 524 172 508 152 C 500 168 488 178 474 180 C 492 162 490 140 470 130 Z"/>

  <!-- Kopf -->
  <circle cx="500" cy="188" r="42" fill="url(#lion)"/>
  <!-- Ohren -->
  <path d="M478 156 L470 132 L492 146 Z" fill="#8a6f42"/>
  <path d="M516 152 L528 130 L532 156 Z" fill="#8a6f42"/>
  <!-- Schnauze -->
  <path d="M528 190 C 552 186 568 194 570 206 C 571 216 560 222 544 220 L 524 212 Z" fill="#a8894e"/>
  <circle cx="566" cy="204" r="6" fill="#3a2c14"/>
  <!-- gemeisselte Augen -->
  <ellipse cx="492" cy="182" rx="5" ry="3.4" fill="#3a2c14"/>
  <ellipse cx="514" cy="178" rx="5" ry="3.4" fill="#3a2c14"/>
  <!-- Nasen-/Mundlinie -->
  <path d="M540 214 C 530 220 518 220 510 216" stroke="#5e4a26" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Konturen / Verwitterung -->
  <g fill="none" stroke="#5e4a26" stroke-width="2.4" opacity="0.65">
    <path d="M150 240 C 180 210 230 200 270 210"/>
    <path d="M300 250 C 350 228 420 226 470 244"/>
    <path d="M392 172 C 420 178 446 192 462 212"/>
  </g>
  <!-- Risse -->
  <g stroke="#4a3a1e" stroke-width="1.8" opacity="0.7" fill="none">
    <path d="M330 230 L344 248 L338 262"/>
    <path d="M430 200 L422 220 L430 236"/>
  </g>
  <!-- Moos -->
  <g fill="#55402c" opacity="0.55">
    <ellipse cx="180" cy="268" rx="24" ry="9"/>
    <ellipse cx="380" cy="286" rx="30" ry="8"/>
    <ellipse cx="300" cy="200" rx="16" ry="7"/>
  </g>
  <!-- Gold-Rimlight oben -->
  <path d="M270 196 C 330 184 430 188 496 214" stroke="#ffd76a" stroke-width="4" opacity="0.35" fill="none" stroke-linecap="round"/>
</svg>
