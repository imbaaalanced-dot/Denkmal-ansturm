<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <pattern id="speck" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect x="4" y="9" width="2" height="2" fill="#392f2e"/><rect x="22" y="3" width="1.6" height="1.6" fill="#151012"/>
      <rect x="38" y="14" width="2" height="1.6" fill="#392f2e"/><rect x="12" y="26" width="1.6" height="2" fill="#151012"/>
      <rect x="30" y="31" width="2" height="2" fill="#392f2e"/><rect x="44" y="40" width="1.6" height="1.6" fill="#151012"/>
      <rect x="8" y="42" width="2" height="1.6" fill="#392f2e"/><rect x="26" y="20" width="1.4" height="1.8" fill="#151012"/>
      <rect x="17" y="36" width="1.8" height="1.4" fill="#392f2e"/><rect x="41" y="25" width="1.6" height="2" fill="#151012"/>
    </pattern>
    <pattern id="gras" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M12 60 L15 48 M20 78 L18 64 M44 30 L47 20 M58 66 L55 52 M76 40 L80 30 M34 84 L36 72 M84 82 L82 70 M66 14 L69 6" stroke="#4a4132" stroke-width="1.6" opacity="0.55" fill="none"/>
      <path d="M8 40 L10 30 M28 52 L26 42 M50 76 L53 66 M72 58 L70 46 M88 24 L90 14" stroke="#201b17" stroke-width="1.4" opacity="0.5" fill="none"/>
    </pattern>
    <pattern id="laub" width="128" height="128" patternUnits="userSpaceOnUse">
      <ellipse cx="14" cy="22" rx="4" ry="2.2" fill="#8a3a28" transform="rotate(24 14 22)"/>
      <ellipse cx="52" cy="12" rx="3.4" ry="1.9" fill="#96402c" transform="rotate(-30 52 12)"/>
      <ellipse cx="96" cy="30" rx="4.4" ry="2.4" fill="#5e2f22" transform="rotate(48 96 30)"/>
      <ellipse cx="30" cy="66" rx="3.6" ry="2" fill="#a83828" transform="rotate(-12 30 66)"/>
      <ellipse cx="74" cy="58" rx="4" ry="2.2" fill="#6b4430" transform="rotate(70 74 58)"/>
      <ellipse cx="112" cy="84" rx="3.4" ry="1.8" fill="#8a3a28" transform="rotate(-52 112 84)"/>
      <ellipse cx="44" cy="106" rx="4.2" ry="2.3" fill="#96402c" transform="rotate(18 44 106)"/>
      <ellipse cx="90" cy="116" rx="3.6" ry="2" fill="#5e2f22" transform="rotate(-36 90 116)"/>
      <ellipse cx="118" cy="8" rx="3" ry="1.7" fill="#a83828" transform="rotate(60 118 8)"/>
    </pattern>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#120608" stop-opacity="0"/>
      <stop offset="1" stop-color="#120608" stop-opacity="0.62"/>
    </radialGradient>
  </defs>

  <!-- Basis: knochengrauer Blutmond-Boden -->
  <rect width="1024" height="1024" fill="#262326"/>

  <!-- grosse Farbflecken (Rasen-Variation) -->
  <g opacity="0.3">
    <ellipse cx="180" cy="150" rx="150" ry="90" fill="#231f22"/>
    <ellipse cx="820" cy="200" rx="170" ry="110" fill="#2b2626"/>
    <ellipse cx="300" cy="760" rx="190" ry="120" fill="#25222a"/>
    <ellipse cx="760" cy="820" rx="160" ry="100" fill="#2a2521"/>
    <ellipse cx="520" cy="480" rx="220" ry="150" fill="#201d1f"/>
    <ellipse cx="90" cy="480" rx="120" ry="80" fill="#2b2626"/>
    <ellipse cx="930" cy="540" rx="130" ry="90" fill="#231f22"/>
    <ellipse cx="480" cy="120" rx="140" ry="80" fill="#2a2521"/>
    <ellipse cx="150" cy="900" rx="150" ry="80" fill="#25222a"/>
    <ellipse cx="880" cy="930" rx="170" ry="90" fill="#201d1f"/>
  </g>

  <!-- feines Kies-Rauschen -->
  <rect width="1024" height="1024" fill="url(#speck)" opacity="0.55"/>

  <!-- Grasbuendel + Blutmond-Laub als Kacheln -->
  <rect width="1024" height="1024" fill="url(#gras)" opacity="0.6"/>
  <rect width="1024" height="1024" fill="url(#laub)" opacity="0.75"/>

  <!-- Kopfsteinpflaster-Platz ums Denkmal (Weltradius 4.4 von 21 -> 107 px um die Mitte) -->
  <circle cx="512" cy="512" r="114" fill="#332e33"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="512" cy="512" r="24" stroke="#4e4a4e" stroke-width="11" stroke-dasharray="13 5"/>
    <circle cx="512" cy="512" r="38" stroke="#565049" stroke-width="11" stroke-dasharray="12 5" stroke-dashoffset="7"/>
    <circle cx="512" cy="512" r="52" stroke="#484449" stroke-width="11" stroke-dasharray="14 5" stroke-dashoffset="3"/>
    <circle cx="512" cy="512" r="66" stroke="#5a544e" stroke-width="11" stroke-dasharray="12 6" stroke-dashoffset="10"/>
    <circle cx="512" cy="512" r="80" stroke="#4c4749" stroke-width="11" stroke-dasharray="15 5" stroke-dashoffset="5"/>
    <circle cx="512" cy="512" r="94" stroke="#585250" stroke-width="11" stroke-dasharray="13 6" stroke-dashoffset="12"/>
    <circle cx="512" cy="512" r="106" stroke="#45424a" stroke-width="10" stroke-dasharray="14 6" stroke-dashoffset="2"/>
  </g>
  <circle cx="512" cy="512" r="15" fill="#56504a"/>

  <!-- Moos am Plazarand -->
  <g fill="#54402e" opacity="0.45">
    <circle cx="512" cy="404" r="4"/><circle cx="586" cy="436" r="3"/><circle cx="616" cy="512" r="4.5"/>
    <circle cx="590" cy="592" r="3"/><circle cx="512" cy="620" r="4"/><circle cx="436" cy="594" r="3.4"/>
    <circle cx="408" cy="512" r="4.2"/><circle cx="438" cy="432" r="3"/><circle cx="452" cy="470" r="2.6"/>
    <circle cx="576" cy="556" r="2.8"/><circle cx="466" cy="566" r="2.4"/>
  </g>

  <!-- Vignette Richtung Arenarand -->
  <rect width="1024" height="1024" fill="url(#vig)"/>
</svg>
