<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0408"/>
      <stop offset="0.45" stop-color="#160a10"/>
      <stop offset="0.75" stop-color="#2a1016"/>
      <stop offset="0.92" stop-color="#1f0d12"/>
      <stop offset="1" stop-color="#1a0c10"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e08a6a" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#b23a48" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b23a48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.42" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#ffd9b0"/>
      <stop offset="0.45" stop-color="#f0a077"/>
      <stop offset="0.8" stop-color="#c9584a"/>
      <stop offset="1" stop-color="#9a2430"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a2430" stop-opacity="0"/>
      <stop offset="1" stop-color="#9a2430" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sterne -->
  <g fill="#e8ddd2">
    <circle cx="80" cy="70" r="1.6" opacity="0.7"/><circle cx="210" cy="140" r="1.1" opacity="0.45"/>
    <circle cx="340" cy="60" r="1.8" opacity="0.8"/><circle cx="470" cy="180" r="1.2" opacity="0.5"/>
    <circle cx="590" cy="90" r="1.5" opacity="0.65"/><circle cx="700" cy="40" r="1" opacity="0.4"/>
    <circle cx="830" cy="150" r="1.7" opacity="0.75"/><circle cx="950" cy="70" r="1.2" opacity="0.5"/>
    <circle cx="1060" cy="120" r="1" opacity="0.4"/><circle cx="1330" cy="80" r="1.6" opacity="0.7"/>
    <circle cx="1450" cy="180" r="1.2" opacity="0.5"/><circle cx="1540" cy="90" r="1.8" opacity="0.8"/>
    <circle cx="150" cy="260" r="1.1" opacity="0.45"/><circle cx="420" cy="300" r="1.4" opacity="0.6"/>
    <circle cx="640" cy="250" r="1" opacity="0.4"/><circle cx="900" cy="230" r="1.3" opacity="0.55"/>
    <circle cx="1240" cy="300" r="1" opacity="0.4"/><circle cx="1500" cy="280" r="1.4" opacity="0.6"/>
    <circle cx="60" cy="420" r="1.2" opacity="0.4"/><circle cx="300" cy="450" r="1" opacity="0.35"/>
    <circle cx="560" cy="400" r="1.3" opacity="0.45"/><circle cx="780" cy="470" r="1" opacity="0.35"/>
    <circle cx="1020" cy="420" r="1.2" opacity="0.4"/><circle cx="1380" cy="460" r="1" opacity="0.4"/>
  </g>

  <!-- Blutmond mit Glow -->
  <circle cx="1180" cy="250" r="300" fill="url(#moonGlow)"/>
  <circle cx="1180" cy="250" r="118" fill="url(#moon)"/>
  <g fill="#8a2430" opacity="0.35">
    <ellipse cx="1145" cy="215" rx="26" ry="20"/>
    <ellipse cx="1215" cy="270" rx="34" ry="24"/>
    <ellipse cx="1170" cy="305" rx="18" ry="14"/>
    <ellipse cx="1230" cy="205" rx="14" ry="11"/>
  </g>

  <!-- Wolken (dunkel, ziehen vor den Mond) -->
  <g fill="#120609">
    <path d="M980 210 C 1040 180 1120 185 1170 205 C 1240 190 1310 205 1350 235 C 1310 255 1230 258 1170 250 C 1110 268 1020 258 980 240 Z" opacity="0.75"/>
    <path d="M1050 320 C 1120 295 1230 300 1300 325 C 1250 345 1140 348 1050 338 Z" opacity="0.6"/>
    <path d="M180 180 C 260 155 360 160 420 185 C 360 205 250 208 180 196 Z" opacity="0.55"/>
    <path d="M600 120 C 680 100 780 105 840 128 C 770 145 660 145 600 134 Z" opacity="0.5"/>
    <path d="M1350 420 C 1430 400 1530 405 1590 428 C 1520 445 1410 445 1350 434 Z" opacity="0.55"/>
  </g>

  <!-- roter Bodennebel -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#mist)"/>

  <!-- ferne Totenbaum-Silhouetten am Horizont -->
  <path fill="#120609" d="M0 900 L0 820 L40 820 L48 780 L56 820 L110 820 L118 790 L126 820 L200 820 L200 900 Z
    M260 900 L260 830 L300 830 L312 770 L318 800 L330 760 L338 805 L352 830 L420 830 L420 900 Z
    M1450 900 L1450 815 L1500 815 L1510 770 L1520 812 L1535 780 L1545 820 L1600 820 L1600 900 Z"/>
</svg>
