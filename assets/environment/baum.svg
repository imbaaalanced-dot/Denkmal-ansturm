<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1216"/>
      <stop offset="0.5" stop-color="#0d0810"/>
      <stop offset="1" stop-color="#070510"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a4a" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#c2761d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2761d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Boden-Schatten -->
  <ellipse cx="200" cy="580" rx="120" ry="16" fill="#0d0508" opacity="0.55"/>

  <!-- Wurzeln -->
