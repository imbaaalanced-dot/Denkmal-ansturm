    <path d="M200 580 L150 588 L188 566 Z"/>
    <path d="M200 580 L250 590 L214 564 Z"/>
    <path d="M200 578 L120 582 L190 562 Z"/>
    <path d="M200 578 L285 580 L212 560 Z"/>
  </g>

  <!-- Stamm -->
  <path fill="url(#bark)" d="M186 580 C 192 480 178 420 188 340 C 194 290 186 250 196 200 L214 200 C 206 250 214 292 208 342 C 200 420 214 480 220 580 Z"/>

  <!-- Aeste -->
  <g fill="none" stroke="url(#bark)" stroke-linecap="round">
    <path d="M198 210 C 160 170 130 150 96 118" stroke-width="14"/>
    <path d="M96 118 C 80 100 70 84 62 62" stroke-width="8"/>
    <path d="M96 118 C 104 96 108 78 112 58" stroke-width="7"/>
    <path d="M204 230 C 250 190 286 172 322 140" stroke-width="13"/>
    <path d="M322 140 C 340 124 352 108 360 88" stroke-width="8"/>
    <path d="M322 140 C 316 118 312 100 310 82" stroke-width="7"/>
    <path d="M200 260 C 176 236 160 220 142 200" stroke-width="9"/>
    <path d="M206 300 C 236 282 258 268 282 246" stroke-width="9"/>
    <path d="M196 170 C 200 140 196 116 200 92" stroke-width="10"/>
    <path d="M200 92 C 192 72 188 56 186 40" stroke-width="6"/>
    <path d="M200 92 C 210 74 216 58 220 42" stroke-width="6"/>
  </g>

  <!-- Glut in einer Astgabel -->
  <circle cx="282" cy="246" r="34" fill="url(#ember)"/>
  <circle cx="142" cy="200" r="22" fill="url(#ember)" opacity="0.7"/>

  <!-- wenige tote Blutmond-Blaetter -->
  <g fill="#5e2f22" opacity="0.8">
    <ellipse cx="120" cy="150" rx="7" ry="3.4" transform="rotate(30 120 150)"/>
    <ellipse cx="290" cy="180" rx="6" ry="3" transform="rotate(-40 290 180)"/>
    <ellipse cx="210" cy="120" rx="6" ry="3" transform="rotate(70 210 120)"/>
    <ellipse cx="170" cy="250" rx="5" ry="2.6" transform="rotate(-15 170 250)"/>
