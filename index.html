<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1018" />
  <title>Denkmal Ansturm – L01 Ender Dorfkirche (Prototyp)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0d1018; font-family: system-ui, sans-serif; color: #d7deea; -webkit-user-select: none; user-select: none; }
    canvas#game { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; pointer-events: none; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .chip { background: rgba(10, 14, 24, 0.82); border: 1px solid #2c3a55; border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
    .bottom { display: flex; flex-direction: column; gap: 8px; }
    #hp-wrap { position: relative; height: 22px; background: rgba(10, 14, 24, 0.82); border: 1px solid #2c3a55; border-radius: 11px; overflow: hidden; }
    #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #b23a48, #d76a5a); transition: width 0.25s ease; }
    #hp-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px #000; }
    .controls { display: flex; gap: 6px; pointer-events: auto; }
    .controls button { flex: 1; padding: 10px 6px; font-size: 14px; font-weight: 700; color: #d7deea; background: rgba(22, 30, 48, 0.92); border: 1px solid #2c3a55; border-radius: 10px; cursor: pointer; }
    .controls button.active { background: #2f5bd0; border-color: #5580ff; }
    .controls button:active { transform: scale(0.96); }
    #state-btn { flex: 1.6; background: #6c2f9c !important; border-color: #9a5fd0 !important; }
    #hint { text-align: center; font-size: 11px; opacity: 0.75; }
    #banner { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%); background: rgba(8, 10, 18, 0.9); border: 1px solid #5580ff; border-radius: 12px; padding: 14px 22px; font-size: 18px; font-weight: 800; letter-spacing: 0.4px; text-align: center; pointer-events: none; max-width: 90vw; }
    #banner[hidden] { display: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="top">
      <div class="chip" id="wave-chip">Welle 0/100</div>
      <div class="chip" id="energy-chip">Energie 60</div>
    </div>
    <div class="bottom">
      <div id="hp-wrap"><div id="hp-fill"></div><span id="hp-text">Loewe 1000 / 1000</span></div>
      <div class="controls">
        <button data-speed="1" class="active">x1</button>
        <button data-speed="2">x2</button>
        <button data-speed="3">x3</button>
        <button data-speed="5">x5</button>
        <button id="state-btn">Start</button>
      </div>
      <div id="hint">Verteidige den Löwen! Slot antippen = Platzhalter-Turm (10 Energie) · Dorfkirche am Rand ist Kulisse</div>
    </div>
  </div>
  <div id="banner" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
